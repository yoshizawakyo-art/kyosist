<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>kyosist — Login</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div id="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">K</div>
        <h1>kyosist</h1>
        <p class="login-subtitle">ログイン</p>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="email" class="form-label">メールアドレス</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="your@email.com"
            required
          />
          <span id="email-error" class="form-error"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">パスワード</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="••••••••"
            required
          />
          <span id="password-error" class="form-error"></span>
        </div>

        <button type="submit" id="login-btn" class="login-btn">
          <span class="btn-text">ログイン</span>
          <span class="btn-loader" style="display: none;">処理中...</span>
        </button>

        <div id="form-error" class="form-error form-error-message"></div>
      </form>

      <div class="login-footer">
        <p class="footer-text">
          アカウントをお持ちではありませんか？
          <a href="/signup/" class="footer-link">新規登録</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
