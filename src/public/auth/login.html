<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - Kyosist</title>
    <link rel="stylesheet" href="../common/base.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Kyosist</h1>
                <p>AIチャットシステム</p>
            </div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="your@email.com"
                        class="form-input"
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="8文字以上"
                        class="form-input"
                    >
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div id="apiError" class="error-message error-message--api"></div>

                <button
                    type="submit"
                    id="submitButton"
                    class="btn btn--primary btn--full"
                >
                    <span class="btn-text">ログイン</span>
                    <span class="spinner" id="spinner"></span>
                </button>
            </form>

            <div class="login-footer">
                <a href="./forgot-password.html" class="link-secondary">パスワードをお忘れですか?</a>
                <span class="divider">•</span>
                <a href="./signup.html" class="link-secondary">新規登録</a>
            </div>
        </div>
    </div>

    <script src="./login.js"></script>
</body>
</html>
