<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードをお忘れですか? - Kyosist</title>
    <link rel="stylesheet" href="../common/base.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>パスワードをお忘れですか?</h1>
                <p>登録したメールアドレスを入力してください</p>
            </div>

            <form id="forgotPasswordForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="your@email.com"
                        class="form-input"
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <div id="apiError" class="error-message error-message--api"></div>

                <button
                    type="submit"
                    id="submitButton"
                    class="btn btn--primary btn--full"
                >
                    <span class="btn-text">リセットリンクを送信</span>
                    <span class="spinner" id="spinner"></span>
                </button>
            </form>

            <div class="login-footer">
                <a href="./login.html" class="link-secondary">ログインページへ戻る</a>
                <span class="divider">•</span>
                <a href="./signup.html" class="link-secondary">新規登録はこちら</a>
            </div>
        </div>
    </div>

    <script src="./forgot-password.js"></script>
</body>
</html>
