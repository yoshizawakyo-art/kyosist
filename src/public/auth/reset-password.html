<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードをリセット - Kyosist</title>
    <link rel="stylesheet" href="../common/base.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>新しいパスワードを設定</h1>
                <p>新しいパスワードを入力してください</p>
            </div>

            <form id="resetPasswordForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="8文字以上"
                        class="form-input"
                    >
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div id="apiError" class="error-message error-message--api"></div>

                <button
                    type="submit"
                    id="submitButton"
                    class="btn btn--primary btn--full"
                >
                    <span class="btn-text">パスワードをリセット</span>
                    <span class="spinner" id="spinner"></span>
                </button>
            </form>

            <div class="login-footer">
                <a href="./login.html" class="link-secondary">ログインページへ戻る</a>
            </div>
        </div>
    </div>

    <script src="./reset-password.js"></script>
</body>
</html>
