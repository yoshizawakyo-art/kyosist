<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>kyosist chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 40px 16px; }
    #app { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 1.2rem; color: #333; }
    #messages {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      min-height: 300px;
      max-height: 500px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; font-size: 0.95rem; line-height: 1.4; }
    .msg.user { background: #4f86f7; color: #fff; align-self: flex-end; }
    .msg.bot  { background: #e9e9e9; color: #333; align-self: flex-start; }
    #form { display: flex; gap: 8px; }
    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    #input:focus { border-color: #4f86f7; }
    #send {
      padding: 10px 20px;
      background: #4f86f7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #send:hover { background: #3a70e0; }
    #send:disabled { background: #aaa; cursor: default; }
  </style>
</head>
<body>
  <div id="app">
    <h1>kyosist — AI通信パイプライン検証</h1>
    <div id="messages"></div>
    <div id="form">
      <input id="input" type="text" placeholder="メッセージを入力…" autocomplete="off">
      <button id="send">送信</button>
    </div>
  </div>
  <script src="main.js" defer></script>
</body>
</html>
